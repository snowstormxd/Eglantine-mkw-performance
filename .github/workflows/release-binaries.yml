name: Windows PGO

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a downloadable Windows prerelease
        type: boolean
        default: true
  push:
    branches: [mkw-windows-pgo]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakeModules/**'
      - 'externals/**'
      - 'dist/**'
      - 'tools/**'
      - '.patch/**'
      - 'cpmfile.json'
      - '.github/workflows/release-binaries.yml'

permissions:
  contents: read

concurrency:
  group: windows-pgo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-pgo:
    name: Native Windows x64 PGO
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      # Keep upstream's native UCRT64 clang/Qt ABI and dependencies.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Restore dependency downloads
        id: cpm
        uses: actions/cache/restore@v4
        with:
          path: .cache/cpm
          key: cpm-Windows-pgo-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cpm-Windows-pgo-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}-
            cpm-Windows-

      - name: Restore compiler objects
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: objects-windows-x86_64-pgo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-windows-x86_64-pgo-

      - name: Download upstream PGO profile
        run: |
          set -euo pipefail
          curl --retry 4 -fsSL -o eden.profdata \
            https://github.com/Eden-CI/PGO/releases/latest/download/eden.profdata
          test -s eden.profdata
          clang --version
          llvm-profdata show eden.profdata | head -12
          sha256sum eden.profdata > pgo-profile.sha256
          pacman -Q > windows-dependencies.txt
          export CCACHE_BASEDIR="$(cygpath -m "$GITHUB_WORKSPACE")"
          ccache --set-config "base_dir=$CCACHE_BASEDIR"
          ccache --zero-stats

      - name: Check cache and command-range regressions
        run: |
          set -euo pipefail
          mkdir -p build/checks
          for name in uniform_stream_reuse gpu_written_ranges usage_tracker; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Isrc \
              "tools/integration/${name}_test.cpp" -o "build/checks/${name}.exe"
            "build/checks/${name}.exe"
          done

      - name: Configure upstream native Windows PGO target
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eden.profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF \
            -DYUZU_CMD=OFF -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" "-DCMAKE_CXX_FLAGS=$profile"

      - name: Build eglantine.exe
        run: cmake --build build/release --target yuzu --parallel 4

      - name: Save compiler statistics
        if: always()
        run: ccache --show-stats

      # Explicit save steps retain useful work from a failed compile too.
      - name: Save dependency downloads
        if: ${{ always() && steps.cpm.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/cpm
          key: ${{ steps.cpm.outputs.cache-primary-key }}

      - name: Save compiler objects
        if: ${{ always() && steps.objects.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}

      - name: Package Qt and dependent DLLs
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f eglantine.exe
          windeployqt6 --release --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler eglantine.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "${source,,}" in
                *system32* | *syswow64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          deps eglantine.exe
          find . -name '*.dll' | while read -r dll; do deps "$dll"; done
          cp ../../../LICENSE.txt ./LICENSE.txt
          cp -R ../../../LICENSES ./LICENSES
          cp ../../../pgo-profile.sha256 ../../../windows-dependencies.txt ./
          git -C ../../.. rev-parse HEAD > source-commit.txt
          cp ../../../docs/mkw/TESTING.md ./TESTING.md
          cp ../../../tools/windows/record-memory.ps1 ./record-memory.ps1

      - name: Check native executable and packaged startup
        shell: pwsh
        run: ./tools/windows/smoke-pgo.ps1 -BinPath build/release/bin

      - name: Upload portable Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-windows-x86_64-pgo-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows prerelease
        if: github.event_name == 'push' || inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "eglantine-windows-x86_64-pgo-$($env:GITHUB_SHA).zip"
          Compress-Archive -Path build/release/bin/* -DestinationPath $zip -CompressionLevel Fastest
          $short = $env:GITHUB_SHA.Substring(0, 7)
          gh release create "windows-pgo-$env:GITHUB_RUN_NUMBER" $zip `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease `
            --title "MKW Windows PGO $short" --notes-file docs/mkw/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
